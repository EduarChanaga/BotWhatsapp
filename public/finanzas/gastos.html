<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compras y gastos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="app-nav">
    <a href="dashboard.html" class="app-nav__brand">Finanzas</a>
    <button type="button" class="app-nav__toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Abrir menú de navegación">
      <span class="app-nav__toggle-icon" aria-hidden="true"></span>
    </button>
    <div class="app-nav__menu" id="nav-menu">
      <div class="app-nav__links">
        <div class="app-nav__group" role="group" aria-label="Pagos">
          <span class="app-nav__group-title">Pagos</span>
          <div class="app-nav__group-links"><a href="pagos.html">Pagos</a><a href="hormiga.html">Hormiga</a><a href="gastos.html" class="active">Compras y gastos</a></div>
        </div>
        <div class="app-nav__group" role="group" aria-label="Registros">
          <span class="app-nav__group-title">Registros</span>
          <div class="app-nav__group-links"><a href="dashboard.html">Cuentas</a><a href="prestamos.html">Préstamos</a><a href="personas.html">Personas</a></div>
        </div>
        <div class="app-nav__group app-nav__group--solo" role="group" aria-label="Resumen">
          <span class="app-nav__group-title">Resumen</span>
          <div class="app-nav__group-links"><a href="resumen.html">Resumen</a></div>
        </div>
        <div class="app-nav__group app-nav__group--solo" role="group" aria-label="Extra">
          <span class="app-nav__group-title">Extra</span>
          <div class="app-nav__group-links"><a href="gaming.html">Gaming</a></div>
        </div>
      </div>
      <span class="app-nav__user" id="user-label"></span>
      <div class="app-nav__actions"><button type="button" class="btn btn--ghost btn--sm" id="btn-logout">Salir</button></div>
    </div>
  </nav>

  <div id="alerta-pagos-semana" class="alerta-pagos-semana" hidden></div>
  <main class="app-main">
    <header class="page-header page-header__row">
      <div><h1>Compras y gastos</h1><p>Registra salidas, compras y otros gastos puntuales.</p></div>
    </header>
    <div class="hormiga-toolbar">
      <div class="form-group hormiga-toolbar__mes"><label for="filtro-mes">Mes</label><input type="month" id="filtro-mes"></div>
      <div class="hormiga-subtotal"><span class="hormiga-subtotal__label">Total del mes</span><span class="hormiga-subtotal__valor" id="subtotal-mes">0,00 €</span></div>
    </div>
    <form id="form-gasto" class="hormiga-form card-panel">
      <h2 id="form-gasto-titulo">Nuevo gasto</h2>
      <div class="gasto-form__grid">
        <div class="form-group"><label for="gasto-fecha">Fecha</label><input type="date" id="gasto-fecha" required></div>
        <div class="form-group"><label for="gasto-monto">Monto</label><input type="number" id="gasto-monto" min="0" step="0.01" required placeholder="0"></div>
        <div class="form-group"><label for="gasto-descripcion">Descripción</label><input type="text" id="gasto-descripcion" required placeholder="Ej. salida al cine, compra de ropa…"></div>
        <div class="form-group"><label for="gasto-persona">Con quién / para quién</label><select id="gasto-persona"><option value="">Sin persona asociada</option></select></div>
        <div class="gasto-form__actions"><button type="button" class="btn btn--ghost btn--sm" id="btn-cancelar-gasto" hidden>Cancelar</button><button type="submit" class="btn btn--primary btn--sm" id="btn-guardar-gasto">Agregar gasto</button></div>
      </div>
    </form>
    <div id="empty-gastos" class="empty-state" hidden><strong>Sin compras o gastos este mes</strong><p>Registra una salida, compra u otro gasto puntual.</p></div>
    <ul id="lista-gastos" class="hormiga-list"></ul>
  </main>
  <script src="js/nav.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/alertas.js"></script>
  <script src="js/gastos-page.js"></script>
</body>
</html>
